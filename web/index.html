<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HACS Trends</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* A console. Dark is the design and stays the base; light is not an inversion of it
   but a contrast match - every colour was darkened until it reaches the same ratio on
   white that its counterpart reaches on the dark ground: body text 15.1:1, second level
   6.7:1, description 3.5:1, separators 1.1:1. The weak values were copied across too,
   so nothing suddenly reads louder than it did. Measured, not eyeballed. The amber
   accent cannot survive the move - #e0a955 is 1.9:1 on white and unusable as text - so
   light gets ochre at 5.0:1. Every colour is painted explicitly in both themes; nothing
   relies on the host's background. */
:root{
  color-scheme:dark;
  --bg:#0f1317; --panel:#12171c; --panel-2:#141a20; --raise:#1c242c;
  --ink:#e6ecf2; --ink-2:#8fa0b0; --ink-3:#5d6f7f; --ink-4:#465666; --ink-hi:#f3f7fb;
  --line:#1e262e; --line-2:#2a3440; --rowline:#171e25;
  --accent:#e0a955; --accent-ink:#0f1317;
  --pos:#6fd08c; --neg:#e07070;
  --active:#6fd08c; --quiet:#d3a03e; --stale:#e0824a; --dormant:#e07070; --unknown:#6f7f8d;
  --plate:#eef2f6; --shadow:0 12px 28px rgba(0,0,0,.45);
  --rail:212px; --row:56px;
  /* The brand block and the head bar meet at one horizontal border. Both used to
     size themselves from their content, so the line broke by 7.7px - and by a
     different amount per language, because the German stamp wraps and the English
     one does not. One height, content centred in it, and the seam holds. */
  --topbar:92px;
}
/* The light palette is written out twice on purpose. The first block serves the visitor
   who never touched the switch and whose system asks for light; the second serves the
   one who chose it. They cannot be merged into a selector list, because a rule inside a
   media query is dead whenever the query is false - and both have the same specificity,
   so the explicit choice wins only by standing later. The dark choice needs no block of
   its own: :not([data-theme="dark"]) already keeps the system rule off it. */
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --bg:#f4f6f9; --panel:#ffffff; --panel-2:#eef2f6; --raise:#e3e9ef;
    --ink:#20272d; --ink-2:#4e5e6c; --ink-3:#798c9e; --ink-4:#9ba9b7; --ink-hi:#0b0f13;
    --line:#e9edef; --line-2:#d2d9df; --rowline:#e4e9ee;
    --accent:#996411; --accent-ink:#ffffff;
    --pos:#217f3e; --neg:#c0342c;
    --active:#217f3e; --quiet:#916817; --stale:#b85013; --dormant:#c0342c; --unknown:#697a8a;
    --plate:#f0f4f8; --shadow:0 12px 28px rgba(15,23,31,.14);
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f4f6f9; --panel:#ffffff; --panel-2:#eef2f6; --raise:#e3e9ef;
  --ink:#20272d; --ink-2:#4e5e6c; --ink-3:#798c9e; --ink-4:#9ba9b7; --ink-hi:#0b0f13;
  --line:#e9edef; --line-2:#d2d9df; --rowline:#e4e9ee;
  --accent:#996411; --accent-ink:#ffffff;
  --pos:#217f3e; --neg:#c0342c;
  --active:#217f3e; --quiet:#916817; --stale:#b85013; --dormant:#c0342c; --unknown:#697a8a;
  --plate:#f0f4f8; --shadow:0 12px 28px rgba(15,23,31,.14);
}
*{box-sizing:border-box}
/* The browser's own [hidden]{display:none} loses against any author rule that sets
   display - .seg and .row both do. Without this line, element.hidden = true sets the
   attribute and changes nothing: dead-looking period buttons and pooled rows that stay
   painted with stale content. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden}
.m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------------- left rail ---------------- */
.rail{width:var(--rail);flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh;overflow-y:auto}
.brand{min-height:var(--topbar);padding:10px 18px;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:center}
.brand .n{font-size:16px;font-weight:700;letter-spacing:-.015em}
.brand .s{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.13em;
  color:var(--accent);margin-top:3px;text-transform:uppercase}
/* The run stamp is context, not identity - it must not compete with the repository
   count for the accent colour. The stale line appears only when the data day and the
   run day disagree, and then it is a warning. */
.brand .run{color:var(--ink-3)}
.brand .warn{color:var(--stale)}
.nav{display:flex;flex-direction:column;padding:11px 10px;gap:1px}
.nav button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;
  color:var(--ink-2);cursor:pointer;text-align:left;width:100%;font-size:13.5px}
.nav button:hover{color:var(--ink);background:var(--panel-2)}
.nav button[aria-current="true"]{background:var(--raise);color:var(--ink-hi);font-weight:600}
.nav button[aria-current="true"] svg{color:var(--accent)}
.nav svg{flex-shrink:0;color:var(--ink-3)}
.railsec{margin:9px 18px 0;padding-top:13px;border-top:1px solid var(--line)}
.railsec h3{margin:0 0 8px;font-family:"JetBrains Mono",monospace;font-size:9px;
  letter-spacing:.13em;color:var(--ink-4);font-weight:400;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;padding:3px 9px;border:1px solid var(--line-2);border-radius:12px;
  color:var(--ink-2);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}
.chip .c{font-family:"JetBrains Mono",monospace;font-size:9.5px;opacity:.7;margin-left:4px}
.railfoot{margin-top:auto;padding:13px 18px;border-top:1px solid var(--line);
  font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.09em;
  color:var(--ink-4);line-height:1.8}
.railfoot a{color:var(--ink-3)}

/* ---------------- main ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}
.head{display:flex;align-items:center;gap:16px;min-height:var(--topbar);padding:10px 26px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1 1 320px}
.head h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.012em}
.head p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:88ch}
.head p b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;height:32px;border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.seg button{height:100%;padding:0 12px;display:flex;align-items:center;
  font-family:"JetBrains Mono",monospace;font-size:11px;
  letter-spacing:.05em;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.seg button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.search{position:relative}
.search input{width:210px;height:32px;padding:0 11px 0 30px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px}
.search input::placeholder{color:var(--ink-4)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-4)}
.ac{position:absolute;top:calc(100% + 5px);left:0;width:330px;max-width:76vw;z-index:30;
  background:var(--panel);border:1px solid var(--line-2);border-radius:7px;overflow:hidden;
  box-shadow:var(--shadow)}
.ac button{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;cursor:pointer;
  text-align:left;border-bottom:1px solid var(--line)}
.ac button:last-child{border-bottom:0}
.ac button[aria-selected="true"]{background:var(--raise)}
.ac .ic{width:22px;height:22px;border-radius:5px}
.ac .an{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.ac .as{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--ink-4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto}
/* Sprache und Theme sind ein Paar in der Ecke. Die Sprache bleibt bewusst ein select
   und wird kein Segment: zwei Sprachen passen in eine Leiste, fuenf nicht, und die Liste
   soll wachsen koennen, ohne die Kopfleiste neu zu bauen. Beide bekommen deshalb
   denselben Rahmen, dieselbe Rundung, dieselbe Hoehe und dieselbe Schrift, damit sie als
   eine Gruppe gelesen werden. Der Pfeil ist selbst gezeichnet statt vom System geliehen,
   weil das Systemdreieck seine Farbe nicht vom Thema nimmt. */
.corner{display:flex;align-items:center;gap:7px}
/* Zeitfenster, Suche, Sprache und Theme stehen in einer Reihe und sollen wie ein
   Satz Bedienelemente wirken, nicht wie vier zufaellig hohe Kaesten. Gemeinsame Hoehe
   32px, box-sizing:border-box (siehe *{} oben) rechnet Rahmen und Innenabstand hinein. */
.langsel{position:relative;display:inline-flex}
.langsel::after{content:"";position:absolute;right:9px;top:50%;margin-top:-2px;
  pointer-events:none;width:0;height:0;border:4px solid transparent;border-top-color:var(--ink-3)}
.langsel select,.themesel{height:32px;border:1px solid var(--line-2);border-radius:6px;
  background:var(--panel)}
.langsel select{appearance:none;-webkit-appearance:none;color:var(--ink-2);cursor:pointer;
  font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.05em;
  padding:0 25px 0 10px;line-height:30px}
.langsel select:hover{color:var(--ink)}
.themesel{display:inline-flex;overflow:hidden}
.themesel button{display:flex;align-items:center;justify-content:center;width:32px;
  color:var(--ink-3);cursor:pointer}
.themesel button:hover:not([aria-pressed="true"]){color:var(--ink);background:var(--panel-2)}
.themesel button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.themesel svg{display:block}

/* One line standing in for the explanation and the summary figures - phone only.
   Without this rule it is a plain <button>, so boot()'s hidden=false put it on the
   desktop too, under the head bar, reading "What this view shows". The phone rule
   carries !important and still wins there. */
.disclose{display:none}

/* summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);
  border-bottom:1px solid var(--line)}
.stat{background:var(--panel);padding:12px 22px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.13em;color:var(--ink-4)}
.stat .v{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:700;line-height:1.2}

/* table */
/* Fixed, not min-height: every view gets the same two-line slot, whether or not its
   columns use the second line. The alternative - shrinking to fit - is what made the
   header jump between 38, 42 and 56px as you switched tabs, because how many columns
   carry a window sub-label differs per view. One constant height beats seven different
   ones that happen to be "as small as possible". */
.thead{display:grid;padding:0 26px;font-family:"JetBrains Mono",monospace;font-size:9px;
  letter-spacing:.12em;color:var(--ink-4);border-bottom:1px solid var(--line);
  background:var(--panel);align-items:stretch;height:56px}
.thead button{display:flex;flex-direction:column;justify-content:center;gap:1px;
  padding:7px 11px;cursor:pointer;overflow:hidden;height:100%;align-items:flex-start;
  font-family:inherit;font-size:inherit;letter-spacing:inherit;color:inherit;text-align:left}
.thead button.r{align-items:flex-end;text-align:right}
.thead button:hover{color:var(--ink-2)}
.thead button[data-active="1"]{color:var(--accent)}
.thead .sub{font-size:8.5px;letter-spacing:.06em;color:var(--ink-4);opacity:.85}
.viewport{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
.spacer{position:relative;width:100%}
.row{display:grid;position:absolute;left:0;right:0;height:var(--row);align-items:center;
  padding:0 26px;border-bottom:1px solid var(--rowline)}
.row:hover{background:var(--panel-2)}
.cell{padding:0 11px;overflow:hidden;min-width:0}
.cell.r{text-align:right}
.rn{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-4)}
.repo{display:flex;align-items:center;gap:10px;min-width:0}
/* Shrink order when the cell runs out of room: the path first (weighted heavily), the
   name only after the path is gone, the version never. A name that could not shrink used
   to push the version out of the cell and get it clipped. */
.repo a{font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;max-width:100%}
.repo a:hover{color:var(--accent);text-decoration:underline}
.repo .slug{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-4);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:100}
.stack{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.l1{display:flex;align-items:baseline;gap:8px;min-width:0}
/* The version never shrinks; the path gives up its characters instead. A truncated
   path still identifies the repository, a truncated version number does not. Pinned to
   the right edge so it stands in one column down the whole table instead of landing
   wherever the path happens to end - a number that moves on every row cannot be read
   by scanning. */
.ver{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3);
  flex-shrink:0;white-space:nowrap;margin-left:auto;padding-left:14px;text-align:right}
.desc{color:var(--ink-3);font-size:11.5px;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Icons come from brands.home-assistant.io, which has one for 2,138 of the 4,193
   repositories - integrations with a brands entry. The rest get the category mark on
   the panel colour rather than the CDN's own placeholder, which would look like a
   broken image repeated two thousand times. Logos are drawn for light backgrounds,
   hence the light plate under them. */
.ic{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--plate);padding:2px;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:contain;display:block}
.ic.fb{background:var(--raise);color:var(--ink-4);padding:0;
  font-family:"JetBrains Mono",monospace;font-size:12px}
.cat{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.num{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.delta{font-family:"JetBrains Mono",monospace;font-size:12.5px;font-weight:700}
.delta.p{color:var(--pos)} .delta.n{color:var(--neg)}
.na{color:var(--ink-4);cursor:help}
.amb{color:var(--quiet);font-size:11px;margin-left:4px;cursor:help}
.pair{display:inline-flex;align-items:baseline;gap:5px;font-family:"JetBrains Mono",monospace}
.pair .sub{font-size:10px;color:var(--ink-4)}
.dotline{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.h-active,.rh-continuous{color:var(--active)}
.h-active .dot,.rh-continuous .dot{background:var(--active)}
.h-quiet,.rh-regular{color:var(--quiet)} .h-quiet .dot,.rh-regular .dot{background:var(--quiet)}
.h-stale,.rh-occasional{color:var(--stale)} .h-stale .dot,.rh-occasional .dot{background:var(--stale)}
.h-dormant,.h-archived,.h-gone,.rh-dormant{color:var(--dormant)}
.h-dormant .dot,.h-archived .dot,.h-gone .dot,.rh-dormant .dot{background:var(--dormant)}
.h-unknown,.rh-never{color:var(--unknown)} .h-unknown .dot,.rh-never .dot{background:var(--unknown)}
.age{color:var(--ink-4);font-family:"JetBrains Mono",monospace;font-size:11px}
.bar{position:relative;display:inline-block}
.bar i{position:absolute;right:0;bottom:-5px;height:2px;background:var(--accent);opacity:.5;border-radius:1px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.foot{padding:9px 26px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:5px 22px;
  font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.07em;color:var(--ink-4)}
.foot .hl{color:var(--ink-2)}

@media (max-width:1240px){ .hide-md{display:none!important} }
/* ---------------- phone ----------------
   The table cannot survive here: its columns are fixed pixels and add up to 694, so on a
   390px screen the browser widened the document to 720 and shrank the whole page - half
   the columns off the edge and everything unreadably small. Below 900px there is no grid
   at all; each row becomes a card that lays itself out, with the figure the current view
   ranks by given the largest type. The explanation and the four summary figures fold away
   behind one line, which is what moved the first row from 539px down the screen to 232. */
@media (max-width:900px){
  :root{--row:96px}
  body{flex-direction:column;overflow:auto;height:auto}
  .rail{width:100%;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;
    border-right:none;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9}
  .brand{border-bottom:none;padding:11px 14px 9px;min-height:0}
  .brand .n{font-size:15px}
  .nav{flex-direction:row;overflow-x:auto;flex:1 0 100%;padding:0 14px 9px;gap:6px;
    scrollbar-width:none}
  .nav::-webkit-scrollbar{height:0}
  .nav button{width:auto;white-space:nowrap;border:1px solid var(--line-2);border-radius:14px;
    padding:6px 12px;min-height:32px;font-size:12px}
  .nav button[aria-current="true"]{border-color:var(--raise)}
  .nav svg{display:none}
  .railsec,.railfoot{display:none}
  .main{height:auto}

  /* The view's name is already on the chip that is switched on, so the heading would say
     it a second time and cost a line of screen. The language picker moves up beside the
     brand, which is where the space is - the rail is sticky, so fixed keeps it in place. */
  .head{flex-direction:column;align-items:stretch;gap:9px;padding:11px 14px;min-height:0}
  .head .t{flex:1 1 auto;gap:0}
  .head h1{display:none}
  .head p{display:none}
  .corner{position:fixed;top:9px;right:12px;z-index:10;gap:5px}
  .langsel select,.themesel{height:34px}
  .langsel select{padding:0 22px 0 8px;line-height:32px}
  .themesel button{width:31px}
  .seg{width:100%}
  .seg button{flex:1;text-align:center;padding:9px 0;min-height:38px}
  .search{width:100%}
  .search input{width:100%;padding:10px 11px 10px 30px;min-height:40px}
  .ac{width:100%}

  .disclose{display:flex!important;align-items:center;gap:7px;width:100%;padding:10px 14px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel);
    color:var(--ink-3);font-size:11.5px;cursor:pointer;text-align:left;min-height:38px}
  .disclose::before{content:"\25B8";color:var(--ink-4)}
  .disclose[aria-expanded="true"]::before{content:"\25BE"}
  body.info-open .head p{display:block;font-size:12.5px}
  .strip{display:none}
  body.info-open .strip{display:grid;grid-template-columns:1fr 1fr}
  .stat{padding:9px 14px}
  .stat .v{font-size:16px}
  .thead{display:none}
  .viewport{overflow:visible;height:auto}

  .row{display:block;padding:0;border-bottom:1px solid var(--rowline)}
  .mcard{display:flex;gap:10px;padding:11px 14px;height:var(--row);align-items:flex-start}
  .mcard .rn{width:19px;flex-shrink:0;padding-top:8px;text-align:right}
  .mcard .ic{width:34px;height:34px;margin-top:2px}
  .mbody{min-width:0;flex:1;display:flex;flex-direction:column}
  .mbody .l1{display:flex;align-items:baseline;gap:8px;min-width:0}
  .mbody a{font-size:14.5px;font-weight:600;color:var(--ink);text-decoration:none;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mbody .ver{margin-left:auto;padding-left:8px}
  .mdesc{color:var(--ink-3);font-size:12px;line-height:1.4;margin-top:1px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .msub{display:flex;flex-wrap:nowrap;gap:12px;margin-top:auto;padding-top:5px;overflow:hidden;
    font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink-3);white-space:nowrap}
  .mbig{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;
    padding-top:2px;min-width:60px;max-width:96px}
  .mbig .bv{font-size:17px;font-weight:700}
  .mbig .bv .delta,.mbig .bv .num{font-size:17px}
  .mbig .bk{font-family:"JetBrains Mono",monospace;font-size:8px;letter-spacing:.1em;
    color:var(--ink-4);margin-top:2px;text-align:right;line-height:1.3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<script>
/* Before the first paint, so the page never flashes the wrong theme. A stored choice
   wins; without one nothing is set at all, which is exactly what lets the media query
   above follow the system. Wrapped because a browser with site data blocked throws on
   the read rather than returning null. */
(function(){try{var t=localStorage.getItem("theme");
if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body>

<nav class="rail">
  <div class="brand">
    <div class="n" data-i18n="app.title">HACS Trends</div>
    <div class="s" id="brand-sub"></div>
    <div class="s run" id="brand-run"></div>
    <div class="s warn" id="brand-stale" hidden></div>
  </div>
  <div class="nav" id="nav"></div>
  <div class="railsec">
    <h3 data-i18n="filter.type"></h3>
    <div class="chips" id="cats"></div>
  </div>
  <div class="railsec">
    <h3 data-i18n="filter.rhythm"></h3>
    <div class="chips" id="rhythms"></div>
  </div>
  <div class="railfoot">
    <span data-i18n="app.sources"></span><br>
    <a href="https://github.com/TheSoulrester/hacs-trends"
       target="_blank" rel="noopener" data-i18n="app.repoLink"></a><br>
    <span data-i18n="app.notOfficial"></span>
  </div>
</nav>

<div class="main">
  <div class="head" id="head-bar">
    <div class="t">
      <h1 id="view-title"></h1>
      <p id="view-note"></p>
    </div>
    <div class="seg" id="windows"></div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="q" type="search" autocomplete="off" role="combobox" aria-expanded="false"
             aria-autocomplete="list" aria-controls="ac">
      <div class="ac" id="ac" role="listbox" hidden></div>
    </div>
    <span class="corner">
      <span class="langsel"><select id="lang" aria-label="Language"></select></span>
      <span class="themesel" id="theme" role="group"></span>
    </span>
  </div>

  <button class="disclose" id="disclose" aria-expanded="false" hidden></button>
  <div class="strip" id="strip"></div>
  <div class="thead" id="thead"></div>
  <div class="viewport" id="viewport"><div class="spacer" id="spacer"></div></div>
  <div class="foot" id="foot"></div>
</div>

<script id="inline-i18n" type="application/json"></script>
<script id="inline-data" type="application/json"></script>
<script src="./app.js"></script>
</body>
</html>
