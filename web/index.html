<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HACS Trends</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#f2f5f7; --surface:#fff; --surface-2:#e9eef2; --surface-3:#f7f9fb;
  --ink:#0d141b; --ink-2:#44576b; --ink-3:#7d8fa0;
  --line:#dbe3ea; --line-2:#c2ceda;
  --accent:#0a6f96; --accent-2:#08596f; --accent-soft:#e0f0f7;
  --pos:#1a7a3e; --neg:#a33131;
  --active:#2f8f4e; --quiet:#a8790c; --stale:#c15b1e; --dormant:#a83232; --unknown:#8794a3;
  --row:58px; --maxw:1560px;
  --shadow:0 1px 2px rgba(13,20,27,.05), 0 4px 16px -8px rgba(13,20,27,.10);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1015; --surface:#121a22; --surface-2:#1b242e; --surface-3:#161f28;
  --ink:#e9eff5; --ink-2:#a2b3c3; --ink-3:#71828f;
  --line:#212c37; --line-2:#2e3d4b;
  --accent:#41acd6; --accent-2:#6ec4e6; --accent-soft:#11303e;
  --pos:#4dc274; --neg:#e07070;
  --active:#4dc274; --quiet:#d3a03e; --stale:#e0824a; --dormant:#e07070; --unknown:#6f7f8d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0b1015; --surface:#121a22; --surface-2:#1b242e; --surface-3:#161f28;
  --ink:#e9eff5; --ink-2:#a2b3c3; --ink-3:#71828f;
  --line:#212c37; --line-2:#2e3d4b;
  --accent:#41acd6; --accent-2:#6ec4e6; --accent-soft:#11303e;
  --pos:#4dc274; --neg:#e07070;
  --active:#4dc274; --quiet:#d3a03e; --stale:#e0824a; --dormant:#e07070; --unknown:#6f7f8d;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 16px -8px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

/* ---------------- masthead ---------------- */
.masthead{background:var(--surface);border-bottom:1px solid var(--line)}
.mast-in{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 26px;padding:22px 0 20px}
.brand h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.brand .dot{color:var(--accent)}
.brand p{margin:5px 0 0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.mast-side{margin-left:auto;display:flex;align-items:center;gap:16px;padding-bottom:2px}
.stamp{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.langsel{position:relative}
.langsel select{appearance:none;background:var(--surface-2);border:1px solid var(--line-2);
  color:var(--ink);border-radius:6px;padding:5px 26px 5px 9px;font-size:12.5px;cursor:pointer}
.langsel::after{content:"▾";position:absolute;right:9px;top:50%;transform:translateY(-52%);
  pointer-events:none;color:var(--ink-3);font-size:10px}

/* ---------------- question cards ---------------- */
.chooser{padding:20px 0 0}
.chooser h2{margin:0 0 11px;font-size:11.5px;font-weight:600;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:9px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;
  transition:border-color .12s,background .12s}
.card:hover{border-color:var(--line-2);background:var(--surface-3)}
.card .t{font-weight:600;font-size:14px;line-height:1.25}
.card .h{font-size:12.5px;color:var(--ink-2);line-height:1.35}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);
  box-shadow:inset 0 0 0 1px var(--accent)}
.card[aria-pressed="true"] .t{color:var(--accent-2)}
.card[aria-pressed="true"] .h{color:var(--ink-2)}

/* ---------------- caveat ---------------- */
.caveat{margin-top:16px;background:var(--surface);border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:12px 15px}
.caveat p{margin:0;font-size:12.5px;color:var(--ink-2);max-width:96ch}
.caveat strong{color:var(--ink);font-weight:600}
.caveat em{font-style:normal;color:var(--accent-2);font-weight:600}

/* ---------------- controls ---------------- */
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:16px 0 14px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line-2);
  border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:none;color:var(--ink-2);font-size:12.5px;padding:5px 11px;
  border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button:hover:not(:disabled){color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow)}
.seg button:disabled{opacity:.42;cursor:not-allowed}
.seg-label{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  margin-right:-8px}
.search{flex:1 1 250px;max-width:360px;position:relative}
.search input{width:100%;padding:8px 11px 8px 33px;border:1px solid var(--line-2);border-radius:8px;
  background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:12.5px;padding:4px 11px;border-radius:20px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
  color:var(--accent-2);font-weight:600}
.chip .c{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.7;margin-left:5px}

/* ---------------- table ---------------- */
.tablewrap{border:1px solid var(--line);border-radius:10px;background:var(--surface);
  overflow:hidden;box-shadow:var(--shadow)}
.thead{display:grid;border-bottom:1px solid var(--line-2);background:var(--surface-2)}
.thead button{background:none;border:none;color:var(--ink-2);font-size:10.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:11px 13px;text-align:left;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.thead button:hover{color:var(--ink)}
.thead button[data-active="1"]{color:var(--accent-2)}
.thead .r{justify-content:flex-end}
.thead .sub{font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink-3);font-size:10px}
.arrow{font-size:8px}
.viewport{height:calc(100vh - 430px);min-height:300px;overflow-y:auto;overflow-x:hidden;position:relative}
.spacer{position:relative;width:100%}
.row{display:grid;position:absolute;left:0;right:0;height:var(--row);align-items:center;
  border-bottom:1px solid var(--line)}
.row:hover{background:var(--surface-3)}
.cell{padding:0 13px;overflow:hidden;min-width:0}
.cell.r{text-align:right}
.repo{display:flex;flex-direction:column;gap:1px;min-width:0}
.repo .top{display:flex;align-items:baseline;gap:8px;min-width:0}
.repo a{font-size:13.5px;font-weight:600;color:var(--ink);text-decoration:none;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repo a:hover{color:var(--accent);text-decoration:underline}
.repo .slug{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1}
.repo .desc{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat{font-size:10.5px;letter-spacing:.02em;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line);padding:2px 8px;border-radius:5px;white-space:nowrap}
.v{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.delta{font-weight:600;font-variant-numeric:tabular-nums}
.delta.p{color:var(--pos)} .delta.n{color:var(--neg)}
.na{color:var(--ink-3);opacity:.5;cursor:help}
.amb{color:var(--quiet);font-size:11px;margin-left:4px;cursor:help}
.bar{position:relative;display:block}
.bar i{position:absolute;right:0;bottom:-5px;height:2px;background:var(--accent);opacity:.4;
  border-radius:1px}
.rank{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-2)}
.health{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.h-active{color:var(--active)} .h-active .dot{background:var(--active)}
.h-quiet{color:var(--quiet)} .h-quiet .dot{background:var(--quiet)}
.h-stale{color:var(--stale)} .h-stale .dot{background:var(--stale)}
.h-dormant,.h-archived,.h-gone{color:var(--dormant)}
.h-dormant .dot,.h-archived .dot,.h-gone .dot{background:var(--dormant)}
.h-unknown{color:var(--unknown)} .h-unknown .dot{background:var(--unknown)}
.age{color:var(--ink-3);font-size:11.5px}
.empty{padding:64px 20px;text-align:center;color:var(--ink-3)}

.foot{display:flex;flex-wrap:wrap;gap:5px 20px;font-size:12px;color:var(--ink-3);
  padding:12px 0 30px;align-items:baseline}
.foot .count{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:1180px){ .hide-md{display:none!important} .viewport{height:calc(100vh - 450px)} }
@media (max-width:780px){
  .hide-sm{display:none!important} .repo .desc{display:none} :root{--row:52px}
  .mast-side{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="masthead"><div class="wrap mast-in">
  <div class="brand">
    <h1><span data-i18n="app.title">HACS Trends</span><span class="dot">.</span></h1>
    <p data-i18n="app.tagline"></p>
  </div>
  <div class="mast-side">
    <span class="stamp" id="stamp"></span>
    <span class="langsel"><label class="sr" for="lang"></label><select id="lang" aria-label="Language"></select></span>
  </div>
</div></header>

<div class="wrap chooser">
  <h2 data-i18n="nav.heading"></h2>
  <div class="cards" id="cards"></div>
  <div class="caveat"><p id="caveat"></p></div>
</div>

<div class="wrap controls">
  <span class="seg-label" data-i18n="window.label"></span>
  <div class="seg" id="windows"></div>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input id="q" type="search" autocomplete="off">
  </div>
  <div class="chips" id="cats"></div>
</div>

<main class="wrap">
  <div class="tablewrap">
    <div class="thead" id="thead"></div>
    <div class="viewport" id="viewport"><div class="spacer" id="spacer"></div></div>
  </div>
  <div class="foot" id="foot"></div>
</main>

<script id="inline-i18n" type="application/json"></script>
<script id="inline-data" type="application/json"></script>
<script src="./app.js"></script>
</body>
</html>
