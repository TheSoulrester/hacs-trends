[project]
name = "hacs-trends"
version = "0.1.0"
description = "Trend and maintenance dashboard for HACS repositories"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
hacs-trends = "hacs_trends.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hacs_trends"]
