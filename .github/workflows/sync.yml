name: Collect and publish

# Twice a day. Not more: the HACS endpoint is paid for by a community project, and
# publishing more often than the source updates gains nothing.
on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit the daily slice
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -e .

      # Order matters and is not obvious: sync builds the repository list, and history
      # attaches to it by repository id. Loading the slices first fails on a foreign key
      # against an empty table - which is exactly what a clean-checkout test caught.
      - name: Fetch HACS data and Home Assistant analytics
        run: hacs-trends sync

      # When each repository was accepted into HACS, read from the git history of
      # hacs/default. A 5.7 MB clone and four seconds, no token, exact back to 2019 -
      # our own first_seen only knows the day this project started collecting.
      - name: Acceptance dates from the HACS list
        run: hacs-trends hacs-dates

      # The database is a cache. What is committed - the daily slices and the star
      # history - is the truth, and it is rebuilt from them on every run.
      - name: Rebuild history from the committed files
        run: |
          hacs-trends history-load
          hacs-trends load-stars

      # The automatic token is enough: about 90 queries at one rate-limit point each.
      - name: Enrich from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hacs-trends enrich
          hacs-trends refine-releases

      - name: Write today's slice and build the page
        id: build
        run: |
          hacs-trends history-write
          hacs-trends stats
          hacs-trends export --out web/data.json
          echo "built=true" >> "$GITHUB_OUTPUT"

      # The page is already built at this point. If committing the slice fails, the run
      # is marked failed so nobody misses it, but the deployment below still happens.
      # Losing a day of history is bad; shipping no page at all because of it is worse -
      # and that is what happened on the first run, where a rejected push skipped the
      # deploy entirely even though the page had been built successfully.
      - name: Commit today's slice
        id: commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No new slice."
            exit 0
          fi
          git commit -m "Data: $(date -u +%F)"

          # The push races with anyone pushing while the run is in flight - which is
          # exactly how the first run failed: a commit landed during the ten minutes the
          # enrichment takes, and the push came back "[rejected] (fetch first)". Rebasing
          # and retrying handles it. Conflicts are not a real risk: this job only ever
          # adds a new file under data/snapshots.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) - rebasing onto the current main."
            git pull --rebase origin main || {
              echo "::error::Rebase failed. Someone changed data/snapshots in a conflicting way."
              exit 1
            }
          done
          echo "::error::Could not push the daily slice after three attempts. If this says 403 rather than rejected, set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions'. The page was still built and deployed."
          exit 1

      # index.html is cached for ten minutes like everything else, so a visitor can load
      # yesterday's HTML against today's script. Stamping the reference keeps the pair
      # consistent: an old index.html asks for the app.js it was built against, a new one
      # for the new file, and neither can be answered from the cache with the other.
      - name: Stamp the script reference with the commit
        run: sed -i "s|\./app\.js|./app.js?v=${GITHUB_SHA::8}|" web/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

      - name: Fail the run if the slice was lost
        if: steps.commit.outcome == 'failure'
        run: |
          echo "::error::The page deployed, but today's slice was not committed - see the error above."
          exit 1

  publish:
    needs: collect
    # Deploy whenever the page was actually built, even if the collect job was marked
    # failed by a lost slice.
    if: always() && needs.collect.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
