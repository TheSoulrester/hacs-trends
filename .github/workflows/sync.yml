name: Collect and publish

# Twice a day. Not more: the HACS endpoint is paid for by a community project, and
# publishing more often than the source updates gains nothing.
on:
  schedule:
    - cron: "23 5 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch:

permissions:
  contents: write   # to commit the daily slice
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -e .

      # Order matters and is not obvious: sync builds the repository list, and history
      # attaches to it by repository id. Loading the slices first fails on a foreign key
      # against an empty table - which is exactly what a clean-checkout test caught.
      - name: Fetch HACS data and Home Assistant analytics
        run: hacs-trends sync

      # The database is a cache. What is committed - the daily slices and the star
      # history - is the truth, and it is rebuilt from them on every run.
      - name: Rebuild history from the committed files
        run: |
          hacs-trends history-load
          hacs-trends load-stars

      # The automatic token is enough: about 90 queries at one rate-limit point each.
      - name: Enrich from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hacs-trends enrich
          hacs-trends refine-releases

      - name: Write today's slice and build the page
        run: |
          hacs-trends history-write
          hacs-trends stats
          hacs-trends export --out web/data.json

      - name: Commit today's slice
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No new slice."
          else
            git commit -m "Data: $(date -u +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  publish:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
